<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fun Exercise Tracker</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <!-- OCEAN BACKGROUND -->
         <div class="ocean-bg" id="oceanBg">
            <div class="ray" style="left: 8%; animation-delay: 0s;"></div>
            <div class="ray" style="left: 25%; animation-delay: 1s;"></div>
            <div class="ray" style="left: 45%; animation-delay: 0.5s;"></div>
            <div class="ray" style="left: 65%; animation-delay: 1.5s;"></div>
            <div class="ray" style="left: 82%; animation-delay: 0.8s;"></div>
            <div class="bubble" style="left: 10%; animation-delay: 0s;"></div>
            <div class="bubble" style="left: 25%; animation-delay: 2s;"></div>
            <div class="bubble" style="left: 40%; animation-delay: 1s;"></div>
            <div class="bubble" style="left: 60%; animation-delay: 3s;"></div>
            <div class="bubble" style="left: 75%; animation-delay: 1.5s;"></div>
            <div class="bubble" style="left: 88%; animation-delay: 2.5s;"></div>
            <div class="weed" style="left: 3%;"></div>
            <div class="weed" style="left: 5%; height: 50px; animation-delay: 0.5s;"></div>
            <div class="weed" style="left: 88%;"></div>
            <div class="weed" style="left: 91%; height: 45px; animation-delay: 1s;"></div>
            <div class="seafloor"></div>
         </div>

         <!-- NAV -->
          <nav class="nav">
            <div class="nav-inner">
                <div class="nav-logo">
                    <div class="nav-logo-dot">🌊</div>
                    <span class="nav-logo-text">Fun Exercise Tracker</span>
                </div>
                <div class="nav-links">
                    <span class="nav-link active">Dashboard</span>
                    <span class="nav-link">Admin</span>
                </div>
                <div class="nav-right">
                    <span class="nav-name">Meredith</span>
                    <div class="nav-avatar">Me</div>
                    <button class="log-btn">+ Log Entry</button>
                </div>
            </div>
          </nav>

          <!-- MAIN CONTENT -->
           <main class="main-content">
            <p class="placeholder">Dashboard coming soon 🌊</p>
           </main>

           <script src="js/main.js"></script>
    </body>
</html>
